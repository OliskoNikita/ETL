version: 2

sources:
  - name: raw
    schema: default
    tables:
      - name: enriched_earthquakes
        description: "Обогащённые данные о землетрясениях (Spark Transform → ClickHouse)"
        columns:
          - name: id
          - name: ts
          - name: place
          - name: region
          - name: magnitude
          - name: felt
          - name: tsunami
          - name: url
          - name: longitude
          - name: latitude
          - name: depth
          - name: load_date